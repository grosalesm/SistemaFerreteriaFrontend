<div class="fondo d-flex align-items-center justify-content-center p-3">
  <div class="card tarjeta border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="logo mb-3"><i class="bi bi-tools"></i></div>
        <h1 class="h4 fw-bold mb-1">Ferretería El Constructor</h1>
        <p class="text-muted mb-0">Sistema de gestión interna</p>
      </div>

      @if (mensaje) {
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2">
          <i class="bi bi-exclamation-circle"></i>
          <span>{{ mensaje }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input id="username" class="form-control" formControlName="username" autocomplete="username"
                 [class.is-invalid]="invalido('username')" autofocus>
          <div class="invalid-feedback">Ingrese su usuario.</div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-group has-validation">
            <input id="password" class="form-control" formControlName="password" autocomplete="current-password"
                   [type]="verPassword ? 'text' : 'password'" [class.is-invalid]="invalido('password')">
            <button type="button" class="btn btn-outline-secondary" (click)="verPassword = !verPassword"
                    [title]="verPassword ? 'Ocultar' : 'Mostrar'">
              <i class="bi" [class]="verPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
            <div class="invalid-feedback">Ingrese su contraseña.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-acento w-100 py-2" [disabled]="enviando">
          @if (enviando) {
            <span class="spinner-border spinner-border-sm me-2"></span>Ingresando...
          } @else {
            Ingresar
          }
        </button>
      </form>
    </div>
  </div>
</div>
